plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dave.livetvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dave.livetvlauncher'
        minSdk 26          // Shield 2019 runs Android 11 (API 30)
        targetSdk 34
        versionCode 34
        versionName '1.7.0'

        // (No GitHub token is built into the app: anyone can read one out of a published APK.
        //  A token for a private repo can only be set on the device, from the phone setup page.)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the local debug key so it can be sideloaded without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // libVLC is large, so build only for 64-bit ARM (NVIDIA Shield, OnePlus Pad, most current devices):
    // output is app-arm64-v8a-release.apk. To also build for 32-bit ARM or the x86_64 emulator,
    // add 'armeabi-v7a' / 'x86_64' to the include list.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
}

dependencies {
    // Third-party code in the app: Google's open-source media player, plus VLC's open-source engine
    // (used only for video/audio this device can't decode itself, e.g. MPEG-2 / AC-3 on tablets).
    // No ad or analytics SDKs.
    implementation 'org.videolan.android:libvlc-all:3.7.2'
    // QR code for "Set up from your phone" (ZXing core: pure Java, no network).
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // RTSP, for security cameras (Eufy and others).
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
}
